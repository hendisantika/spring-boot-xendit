spring.application.name=spring-boot-xendit
# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/xendit_db
spring.datasource.username=yu71
spring.datasource.password=53cret
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
# Xendit Configuration
xendit.api.key=${XENDIT_API_KEY:your-xendit-api-key-here}
xendit.webhook.token=${XENDIT_WEBHOOK_TOKEN:your-webhook-token-here}
# Server Configuration
server.port=8080
