<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title th:text="${isEdit ? 'Edit Product' : 'Add Product'}">Product Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> Product Store
        </a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">
                        <i class="bi" th:classappend="${isEdit ? 'bi-pencil' : 'bi-plus-circle'}"></i>
                        <span th:text="${isEdit ? 'Edit Product' : 'Add New Product'}">Form</span>
                    </h4>
                </div>
                <div class="card-body">
                    <form method="post"
                          th:action="${isEdit ? '/products/' + productId : '/products'}" th:object="${product}">

                        <div class="mb-3">
                            <label class="form-label" for="name">Product Name <span class="text-danger">*</span></label>
                            <input class="form-control" id="name" required
                                   th:field="*{name}" type="text">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="description">Description</label>
                            <textarea class="form-control" id="description" rows="3"
                                      th:field="*{description}"></textarea>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="price">Price (Rp) <span class="text-danger">*</span></label>
                            <input class="form-control" id="price" min="0"
                                   required step="0.01" th:field="*{price}" type="number">
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="stock">Stock <span class="text-danger">*</span></label>
                            <input class="form-control" id="stock" min="0"
                                   required th:field="*{stock}" type="number">
                        </div>

                        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                            <a class="btn btn-secondary" href="/products">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                            <button class="btn btn-primary" type="submit">
                                <i class="bi bi-save"></i>
                                <span th:text="${isEdit ? 'Update' : 'Save'}">Save</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
