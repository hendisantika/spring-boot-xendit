<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Product List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> Product Store
        </a>
    </div>
</nav>

<div class="container mb-5">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${successMessage}">
        <i class="bi bi-check-circle"></i> <span th:text="${successMessage}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${errorMessage}">
        <i class="bi bi-exclamation-triangle"></i> <span th:text="${errorMessage}"></span>
        <button class="btn-close" data-bs-dismiss="alert" type="button"></button>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-box-seam"></i> Products</h2>
        <a class="btn btn-primary" href="/products/new">
            <i class="bi bi-plus-circle"></i> Add Product
        </a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form action="/products" class="row g-3" method="get">
                <div class="col-md-10">
                    <input class="form-control" name="search" placeholder="Search products..."
                           th:value="${search}" type="text">
                </div>
                <div class="col-md-2">
                    <button class="btn btn-primary w-100" type="submit">
                        <i class="bi bi-search"></i> Search
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="row" th:if="${products != null and !products.isEmpty()}">
        <div class="col-md-4 mb-4" th:each="product : ${products}">
            <div class="card h-100 product-card">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Product Name</h5>
                    <p class="card-text text-muted" th:text="${product.description}">Description</p>
                    <h4 class="text-primary">
                        Rp <span th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">0</span>
                    </h4>
                    <p class="mb-3">
                            <span class="badge bg-info badge-stock" th:if="${product.stock > 10}">
                                <i class="bi bi-box"></i> Stock: <span th:text="${product.stock}">0</span>
                            </span>
                        <span class="badge bg-warning badge-stock" th:if="${product.stock > 0 and product.stock <= 10}">
                                <i class="bi bi-box"></i> Stock: <span th:text="${product.stock}">0</span>
                            </span>
                        <span class="badge bg-danger badge-stock" th:if="${product.stock == 0}">
                                <i class="bi bi-x-circle"></i> Out of Stock
                            </span>
                    </p>
                    <div class="d-grid gap-2">
                        <a class="btn btn-outline-primary btn-sm" th:href="@{/products/{id}(id=${product.id})}">
                            <i class="bi bi-eye"></i> View
                        </a>
                        <a class="btn btn-success btn-sm"
                           th:href="@{/payments/checkout/{id}(id=${product.id})}" th:if="${product.stock > 0}">
                            <i class="bi bi-cart-check"></i> Buy Now
                        </a>
                        <button class="btn btn-secondary btn-sm" disabled th:if="${product.stock == 0}">
                            <i class="bi bi-x-circle"></i> Out of Stock
                        </button>
                    </div>
                </div>
                <div class="card-footer bg-transparent">
                    <div class="btn-group w-100" role="group">
                        <a class="btn btn-outline-warning btn-sm" th:href="@{/products/{id}/edit(id=${product.id})}">
                            <i class="bi bi-pencil"></i> Edit
                        </a>
                        <a class="btn btn-outline-danger btn-sm"
                           onclick="return confirm('Are you sure you want to delete this product?')"
                           th:href="@{/products/{id}/delete(id=${product.id})}">
                            <i class="bi bi-trash"></i> Delete
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="alert alert-info text-center" th:if="${products == null or products.isEmpty()}">
        <i class="bi bi-info-circle"></i> No products found.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
