<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Product Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> Product Store
        </a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0"><i class="bi bi-box-seam"></i> Product Details</h4>
                </div>
                <div class="card-body">
                    <h3 class="mb-3" th:text="${product.name}">Product Name</h3>

                    <div class="mb-3">
                        <h5 class="text-muted">Description</h5>
                        <p th:text="${product.description}">Product description</p>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <h5 class="text-muted">Price</h5>
                            <h3 class="text-primary">
                                Rp <span
                                    th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')}">0</span>
                            </h3>
                        </div>
                        <div class="col-md-6">
                            <h5 class="text-muted">Stock</h5>
                            <h3>
                                    <span class="badge bg-info" th:if="${product.stock > 10}">
                                        <i class="bi bi-box"></i> <span th:text="${product.stock}">0</span> units
                                    </span>
                                <span class="badge bg-warning" th:if="${product.stock > 0 and product.stock <= 10}">
                                        <i class="bi bi-exclamation-triangle"></i> <span
                                        th:text="${product.stock}">0</span> units
                                    </span>
                                <span class="badge bg-danger" th:if="${product.stock == 0}">
                                        <i class="bi bi-x-circle"></i> Out of Stock
                                    </span>
                            </h3>
                        </div>
                    </div>

                    <div class="mb-3">
                        <small class="text-muted">
                            Created: <span
                                th:text="${#temporals.format(product.createdAt, 'dd MMM yyyy HH:mm')}">-</span>
                        </small><br>
                        <small class="text-muted">
                            Last Updated: <span
                                th:text="${#temporals.format(product.updatedAt, 'dd MMM yyyy HH:mm')}">-</span>
                        </small>
                    </div>

                    <hr>

                    <div class="d-grid gap-2">
                        <a class="btn btn-success btn-lg"
                           th:href="@{/payments/checkout/{id}(id=${product.id})}" th:if="${product.stock > 0}">
                            <i class="bi bi-cart-check"></i> Buy Now
                        </a>
                        <button class="btn btn-secondary btn-lg" disabled th:if="${product.stock == 0}">
                            <i class="bi bi-x-circle"></i> Out of Stock
                        </button>

                        <div class="btn-group" role="group">
                            <a class="btn btn-warning" th:href="@{/products/{id}/edit(id=${product.id})}">
                                <i class="bi bi-pencil"></i> Edit
                            </a>
                            <a class="btn btn-danger"
                               onclick="return confirm('Are you sure you want to delete this product?')"
                               th:href="@{/products/{id}/delete(id=${product.id})}">
                                <i class="bi bi-trash"></i> Delete
                            </a>
                        </div>

                        <a class="btn btn-outline-secondary" href="/products">
                            <i class="bi bi-arrow-left"></i> Back to Products
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
