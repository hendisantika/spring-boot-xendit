<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Order List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> Product Store
        </a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="/products">
                <i class="bi bi-box-seam"></i> Products
            </a>
            <a class="nav-link active" href="/orders">
                <i class="bi bi-receipt"></i> Orders
            </a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-receipt"></i> Orders</h2>
        <a class="btn btn-primary" href="/products">
            <i class="bi bi-arrow-left"></i> Back to Products
        </a>
    </div>

    <div class="card" th:if="${orders != null and !orders.isEmpty()}">
        <div class="table-responsive">
            <table class="table table-hover mb-0">
                <thead class="table-light">
                <tr>
                    <th>Order Number</th>
                    <th>Customer</th>
                    <th>Total Amount</th>
                    <th>Status</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td>
                        <strong th:text="${order.orderNumber}"></strong>
                    </td>
                    <td>
                        <div th:text="${order.customerName}"></div>
                        <small class="text-muted" th:text="${order.customerEmail}"></small>
                    </td>
                    <td>
                        <strong>Rp <span
                                th:text="${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 0, 'POINT')}">0</span></strong>
                    </td>
                    <td>
                        <span class="badge bg-warning" th:if="${order.paymentStatus.name() == 'PENDING'}">
                            <i class="bi bi-clock"></i> Pending
                        </span>
                        <span class="badge bg-success" th:if="${order.paymentStatus.name() == 'PAID'}">
                            <i class="bi bi-check-circle"></i> Paid
                        </span>
                        <span class="badge bg-danger" th:if="${order.paymentStatus.name() == 'EXPIRED'}">
                            <i class="bi bi-x-circle"></i> Expired
                        </span>
                        <span class="badge bg-secondary" th:if="${order.paymentStatus.name() == 'CANCELLED'}">
                            <i class="bi bi-x-circle"></i> Cancelled
                        </span>
                    </td>
                    <td>
                        <small th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy HH:mm')}"></small>
                    </td>
                    <td>
                        <a class="btn btn-sm btn-primary" th:href="@{/orders/{id}(id=${order.id})}">
                            <i class="bi bi-eye"></i> View
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="alert alert-info text-center" th:if="${orders == null or orders.isEmpty()}">
        <i class="bi bi-info-circle"></i> No orders found.
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
