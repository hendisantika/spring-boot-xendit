<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Payment Invoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> Product Store
        </a>
    </div>
</nav>

<div class="container mb-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-success text-white text-center">
                    <h4 class="mb-0">
                        <i class="bi bi-check-circle"></i> Invoice Created Successfully!
                    </h4>
                </div>
                <div class="card-body">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle"></i>
                        Your payment invoice has been created. Please complete the payment using the link below.
                    </div>

                    <div class="mb-3" th:if="${invoiceData}">
                        <h5>Invoice Details</h5>
                        <table class="table table-bordered">
                            <tr>
                                <th width="200">Invoice ID</th>
                                <td th:text="${invoiceData.invoice_id}">-</td>
                            </tr>
                            <tr>
                                <th>External ID</th>
                                <td th:text="${invoiceData.external_id}">-</td>
                            </tr>
                            <tr>
                                <th>Product</th>
                                <td>
                                    <span th:text="${invoiceData.product_name}">-</span
